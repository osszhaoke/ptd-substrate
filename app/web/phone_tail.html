<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PTDS · 手机小尾巴</title><style>/*FONTS*/
:root{--theme-surface-raised:#111a36;--theme-text-primary:#e8e8e0;--theme-text-secondary:#a9b2c8;--theme-text-tertiary:#8f9db6;--scale-type-meta:14px;--primitive-border-hairline:1px;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--theme-surface-raised);color:var(--theme-text-primary);font-family:"Source Sans 3","Noto Sans SC",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}main{width:300px;max-width:calc(100% - 32px);margin:max(32px,env(safe-area-inset-top)) auto 32px}h1{font-size:17px;margin:0 0 16px}p{margin:8px 0;color:var(--theme-text-secondary)}input,button{font:inherit}input{width:100%;padding:10px;background:transparent;color:inherit;border:1px solid var(--theme-text-secondary);border-radius:10px;letter-spacing:.1em}button.action{padding:9px 14px;border:1px solid var(--theme-text-tertiary);border-radius:10px;background:transparent;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}#pair-go{margin-top:12px;width:100%}#connection{font-size:12px;min-height:2em;overflow-wrap:anywhere}#confirmation{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.15em}#card{position:relative;width:100%;max-width:none;box-shadow:none}#card .tl-name{cursor:default;color:var(--theme-text-secondary)}#card .tl-name:hover{border-color:transparent}#card .tl-t{cursor:default}#card .tl-t:hover{background:rgba(128,140,160,.1)}#card .tl-a{overflow-wrap:anywhere}#leave{margin-top:14px;width:100%}.quiet{font-size:11px}#ending{color:var(--theme-text-primary)}[hidden]{display:none!important}
</style><style id="shared"></style></head><body><main><h1>PTDS · 手机小尾巴</h1><div id="pairing"><p id="instruction">连接与 Mac 相同的 Wi-Fi，输入电脑显示的配对码。</p><form id="pair-form"><label for="code">配对码</label><input id="code" inputmode="numeric" autocomplete="off" maxlength="8" pattern="[0-9]{8}" required><button class="action" id="pair-go">申请查看</button></form><div id="waiting" hidden><p>请在 Mac 确认下面的号码：</p><strong id="confirmation"></strong></div></div><p id="connection" role="status" aria-live="polite"></p><section id="card" class="tl-card" aria-label="近期读数" hidden></section><p id="ending" hidden></p><button class="action" id="leave" hidden>结束查看</button><p class="quiet">仅查看 · Mac 后台采集 · 保留每项实际观测时间</p></main><script nonce="NONCE_VALUE">/*COMPONENT*/</script><script nonce="NONCE_VALUE">
(function(){'use strict';
var $=function(id){return document.getElementById(id);},timer=null,busy=false,stopped=false,hasSession=false,controller=null,revision=null,delay=3000,deadline=0,displayDeadline=0,leaseTimer=null;
var ticket=location.hash.slice(1);if(location.hash)history.replaceState(null,'',location.pathname);
$('shared').textContent=PTDSTail.css;
function hideReadings(){clearTimeout(leaseTimer);$('card').replaceChildren();$('card').hidden=true;revision=null;message('暂时无法确认查看权限 · 已隐藏读数，正在重连');}
function message(t){$('connection').textContent=t;}
function finish(t){stopped=true;clearTimeout(timer);clearTimeout(leaseTimer);if(controller)controller.abort();$('card').replaceChildren();$('card').hidden=true;$('pairing').hidden=true;$('leave').hidden=true;$('ending').hidden=false;$('ending').textContent=t;message('');}
async function request(path,body){var own=new AbortController();controller=own;var timeout=setTimeout(function(){own.abort();},8000);try{var r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'same-origin',signal:own.signal});var j=await r.json();if(!r.ok){var e=new Error(j.detail||'暂时无法连接 Mac');e.status=r.status;e.code=j.code;throw e;}return j;}finally{clearTimeout(timeout);if(controller===own)controller=null;}}
function paint(j){var d=j.display,v=d.visual||{};deadline=Date.now()+j.remaining_seconds*1000;displayDeadline=Date.now()+j.lease_seconds*1000;clearTimeout(leaseTimer);leaseTimer=setTimeout(hideReadings,j.lease_seconds*1000);delay=j.poll_seconds*1000;document.documentElement.style.colorScheme=d.theme==='light'?'light':'dark';Object.keys(v.tokens||{}).forEach(function(k){document.documentElement.style.setProperty(k,v.tokens[k]);});document.body.style.fontFamily=v.font||'';document.body.style.fontSize=v.size||'15px';document.body.style.lineHeight=v.line||'1.6';if(j.revision!==revision){d.readOnly=true;d.icon=PTDSTail.bandIcon;$('card').innerHTML=PTDSTail.html(d);revision=j.revision;}$('card').hidden=false;$('pairing').hidden=true;$('leave').hidden=false;message('手机已连接 Mac · 约 '+j.poll_seconds+' 秒刷新');}
async function tick(){if(stopped||busy||!hasSession||document.hidden)return;if(deadline&&Date.now()>=deadline)return finish('数据分享已结束 · 本次查看已到期。');busy=true;try{var s=await request('/status');if(stopped)return;if(!s.approved){$('pair-form').hidden=true;$('waiting').hidden=false;$('confirmation').textContent=s.confirmation;message('等待 Mac 确认 · 尚未发送读数');$('leave').hidden=false;}else{var j=await request('/snapshot');if(!stopped)paint(j);}}catch(e){if(stopped||document.hidden)return;if(e.status===401||e.status===403)return finish(e.message);message('手机与 Mac 连接中断 · 保留上次读数与原时间');}finally{busy=false;if(!stopped&&!document.hidden)timer=setTimeout(tick,delay);}}
async function pair(value){if(busy)return;busy=true;$('pair-go').disabled=true;message('正在申请配对…');try{var j=await request('/pair',{ticket:value});hasSession=true;$('pair-form').hidden=true;$('waiting').hidden=false;$('confirmation').textContent=j.confirmation;message('等待 Mac 确认 · 尚未发送读数');$('leave').hidden=false;busy=false;await tick();}catch(e){message(e.message);$('pair-go').disabled=false;}finally{busy=false;}}
$('pair-form').onsubmit=function(e){e.preventDefault();pair($('code').value.trim());};
$('leave').onclick=async function(){clearTimeout(timer);if(controller)controller.abort();stopped=true;try{await request('/leave',{});finish('数据分享已结束 · 访问授权已撤回。');}catch(e){finish('已关闭本页查看；网络中断时请在 Mac 停止分享。');}};
document.addEventListener('visibilitychange',function(){clearTimeout(timer);if(document.hidden){if(controller)controller.abort();}else if(!stopped&&hasSession){if(displayDeadline&&Date.now()>=displayDeadline)hideReadings();message('正在重新连接 Mac…');tick();}});
window.addEventListener('pagehide',function(){clearTimeout(timer);if(controller)controller.abort();});
window.addEventListener('pageshow',function(e){if(e.persisted&&!stopped&&hasSession){if(displayDeadline&&Date.now()>=displayDeadline)hideReadings();tick();}});
if(ticket){pair(ticket);ticket='';}else{(async function(){busy=true;try{await request('/status');hasSession=true;busy=false;await tick();}catch(e){if(e.code==='PAIR_REQUIRED')message('请扫码或输入 Mac 上的配对码。');else if(e.code==='SESSION_ENDED')message('上次查看已结束，请输入 Mac 上的新配对码。');else if(e.status===403)finish(e.message);else message('暂时无法连接 Mac，请稍后重新打开。');}finally{busy=false;}})();}
})();
</script></body></html>
